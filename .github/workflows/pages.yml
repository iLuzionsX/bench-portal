name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download CC0 robot asset for Onslaught
        run: |
          set -euo pipefail
          ROBOT_URL="https://raw.githubusercontent.com/age2pierre/solid-akkadi/c6b4450c8738be1887f7b50415e30a9f642e5dc4/demo-app/public/assets/Animated_Robot.glb"
          ROBOT_TMP="/tmp/Animated_Robot.glb"
          curl --fail --location --retry 3 --silent --show-error "$ROBOT_URL" -o "$ROBOT_TMP"
          ROBOT_SIZE="$(wc -c < "$ROBOT_TMP" | tr -d ' ')"
          if [ "$ROBOT_SIZE" != "401024" ]; then
            echo "Unexpected Animated_Robot.glb size: $ROBOT_SIZE" >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import struct
          path = Path('/tmp/Animated_Robot.glb')
          magic, version, declared_length = struct.unpack('<III', path.read_bytes()[:12])
          if magic != 0x46546C67 or version != 2 or declared_length != path.stat().st_size:
              raise SystemExit(f'Invalid GLB header: magic={magic:#x} version={version} declared={declared_length} actual={path.stat().st_size}')
          print(f'Validated glTF {version} robot asset: {declared_length} bytes')
          PY
          cp "$ROBOT_TMP" games/onslaught-fable-5.1/assets/Animated_Robot.glb
          mkdir -p games/onslaught-fable-5.1/source-reconstruction/public/models/enemies
          cp "$ROBOT_TMP" games/onslaught-fable-5.1/source-reconstruction/public/models/enemies/swarm.glb
      - name: Install Onslaught build dependencies
        run: npm install --prefix games/onslaught-fable-5.1/source-reconstruction
      - name: Build reconstructed Onslaught candidate
        run: npm run build --prefix games/onslaught-fable-5.1/source-reconstruction
      - name: Build benchmark portal
        run: npm run build
      - name: Install browser smoke-test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Smoke-test reconstructed Onslaught in Chromium
        run: |
          python3 -m http.server 4176 --directory dist >/tmp/onslaught-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node scripts/smoke-onslaught.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
